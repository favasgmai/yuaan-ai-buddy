<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102657"><title>Yuaan AI Buddy — Animated Robot</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,'Noto Sans Malayalam',sans-serif;color:white;background:radial-gradient(circle at top,#4b62ac,#182c62 55%,#0a1532);min-height:100dvh}main{max-width:600px;margin:auto;padding:14px}header{display:flex;align-items:center;justify-content:space-between;gap:8px}h1{font-size:23px;margin:0}.lang{display:flex;gap:5px}button{cursor:pointer;border:0;color:white;font-weight:700;border-radius:14px;padding:12px;background:#4168d8}.lang button{padding:9px;font-size:12px}.active{background:#00c7f5!important;color:#092450!important}.stage{position:relative;height:min(53vh,400px);min-height:270px;display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:26px;margin:12px 0;background:radial-gradient(circle at center,#507fd8,#1b377b 65%,#112758);border:2px solid #7dc6ff}.stars{position:absolute;inset:0;background-image:radial-gradient(#fff8 1px,transparent 1px);background-size:37px 43px;opacity:.2}.robot{position:relative;width:230px;height:265px;animation:bob 3s ease-in-out infinite;transform-origin:center 85%}.antenna{position:absolute;top:0;left:107px;width:16px;height:45px;background:#d1ecff;border-radius:12px}.antenna:before{content:'';position:absolute;width:27px;height:27px;border-radius:50%;background:#00f4f2;top:-10px;left:-5px;box-shadow:0 0 18px #00e5ff;animation:glow 1.5s infinite alternate}.head{position:absolute;top:37px;left:17px;width:196px;height:153px;border:8px solid #bfe8ff;border-radius:48px;background:linear-gradient(145deg,#e6f7ff,#75b5e8);box-shadow:inset 0 -12px 18px #4b81bc,0 10px 30px #06163d}.face{position:absolute;inset:19px 15px 17px;background:#142c63;border-radius:32px;overflow:hidden}.eye{position:absolute;top:31px;width:31px;height:39px;border-radius:50%;background:#53f9ff;box-shadow:0 0 15px #22d8fa;animation:blink 5.3s infinite}.eye.left{left:29px}.eye.right{right:29px}.brow{position:absolute;top:18px;width:32px;height:5px;border-radius:8px;background:#91eafa}.brow.left{left:28px;transform:rotate(-6deg)}.brow.right{right:28px;transform:rotate(6deg)}.mouth{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);width:51px;height:20px;border:5px solid #6df6f7;border-top:0;border-radius:0 0 55px 55px;transition:.15s}.body{position:absolute;top:187px;left:53px;width:124px;height:78px;background:linear-gradient(130deg,#e1f7ff,#78b8f4);border:6px solid #bfe9ff;border-radius:32px 32px 24px 24px}.body:after{content:'♥';position:absolute;left:43px;top:12px;font-size:28px;color:#ff77b7}.arm{position:absolute;top:198px;width:45px;height:23px;background:#b8e7ff;border-radius:20px;transform-origin:center}.arm.left{left:11px;transform:rotate(-32deg)}.arm.right{right:11px;transform:rotate(32deg);animation:wave 2s infinite}.robot.talking .mouth{animation:talk .22s infinite alternate;background:#40dfe7;border-radius:50%;border:4px solid #b8ffff}.robot.listening .eye{height:45px}.robot.listening .brow{top:12px}.robot.happy .mouth{width:64px;height:27px}.robot.thinking{animation:think 1s ease-in-out infinite}.robot.excited{animation:bob .45s ease-in-out infinite}.robot.excited .eye{background:#ffe56c;box-shadow:0 0 20px #ffe56c}.robot.excited .mouth{width:68px;height:28px}.robot.listening .antenna:before{background:#66ffb4;box-shadow:0 0 24px #66ffb4}.robot.talking .antenna:before{background:#ffcf59}.demo{margin:8px 0 0;display:flex;align-items:center;gap:7px;justify-content:center;font-size:12px;color:#d8e9ff}.demo button{padding:7px 12px;background:#2e568e}.badge{border:1px solid #74d6ff;border-radius:20px;padding:5px 10px;background:#153b69}.speech{position:absolute;bottom:9px;left:9px;right:9px;text-align:center;background:#0a205ddf;padding:9px;border:1px solid #74d6ff;border-radius:14px;font-size:14px}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.chat{height:140px;overflow:auto;background:#0c1c49;border:1px solid #5278c5;border-radius:17px;margin:12px 0;padding:10px;display:flex;flex-direction:column;gap:7px}.msg{padding:9px 12px;max-width:90%;border-radius:14px;white-space:pre-wrap}.bot{background:#30528e;align-self:flex-start}.me{background:#127979;align-self:flex-end}.controls{display:flex;gap:7px}.controls input{flex:1;min-width:0;border:2px solid #9bd7ff;border-radius:13px;padding:12px;font-size:16px}.mic{background:#0875bb}.send{background:#15935b}.status{font-size:13px;min-height:28px;margin:12px 0;color:#bde9ff}.foot{font-size:12px;color:#bed1f2;line-height:1.5}.settings{display:flex;align-items:center;gap:8px;font-size:13px;margin:10px 0}@keyframes bob{50%{transform:translateY(-8px)}}@keyframes glow{to{opacity:.5;box-shadow:0 0 5px #00e5ff}}@keyframes blink{0%,43%,46%,100%{transform:scaleY(1)}44.5%{transform:scaleY(.08)}}@keyframes talk{from{height:8px;width:40px}to{height:33px;width:31px}}@keyframes wave{50%{transform:rotate(-55deg)}}@keyframes think{50%{transform:rotate(4deg) translateY(-4px)}}@media(prefers-reduced-motion:reduce){.robot,.eye,.arm,.antenna:before{animation:none}}

/* Yuaan's original portrait, not the generic vector robot */
.stage{height:min(64vh,530px);min-height:350px;background:#182b60}
.robot{width:100%;height:100%;position:absolute;inset:0;animation:none!important;transform:none!important;overflow:hidden}
.robot>div{display:none!important}
.yuaan-portrait{display:block;width:100%;height:100%;object-fit:cover;object-position:center 20%;animation:portraitBreath 3.8s ease-in-out infinite;transform-origin:50% 55%}
.robot.listening .yuaan-portrait{animation:portraitListen 1.1s ease-in-out infinite}
.robot.talking .yuaan-portrait{animation:portraitTalk .34s ease-in-out infinite alternate}
.robot.thinking .yuaan-portrait{animation:portraitThink 2s ease-in-out infinite}
.robot.excited .yuaan-portrait{animation:portraitDance .55s ease-in-out infinite alternate}
.speech{z-index:3}
@keyframes portraitBreath{0%,100%{transform:scale(1.035) rotate(-.3deg)}50%{transform:scale(1.055) rotate(.3deg)}}
@keyframes portraitListen{0%,100%{transform:scale(1.04) rotate(-1deg)}50%{transform:scale(1.07) rotate(1deg)}}
@keyframes portraitTalk{from{transform:scale(1.045) translateY(0)}to{transform:scale(1.06) translateY(-5px)}}
@keyframes portraitThink{0%,100%{transform:scale(1.04) rotate(-1deg)}50%{transform:scale(1.055) rotate(1.3deg)}}
@keyframes portraitDance{from{transform:scale(1.04) rotate(-2deg)}to{transform:scale(1.06) rotate(2deg)}}
@media(prefers-reduced-motion:reduce){.yuaan-portrait{animation:none!important}}
</style></head><body><main><header><h1>🤖 Yuaan AI Buddy</h1><div class="lang"><button id="en" class="active">English</button><button id="ml">മലയാളം</button></div></header><section class="stage"><div class="stars"></div><div class="robot happy" id="robot" role="img" aria-label="Yuaan-inspired animated portrait"><img class="yuaan-portrait" src="/assets/yuaan-portrait.webp" alt="Yuaan-inspired robot character"><div class="antenna"></div><div class="arm left"></div><div class="arm right"></div><div class="body"></div><div class="head"><div class="face"><div class="brow left"></div><div class="brow right"></div><div class="eye left"></div><div class="eye right"></div><div class="mouth"></div></div></div></div><div class="speech" id="bubble">Hi Yuaan! I'm your robot buddy! 👋</div></section><div class="demo"><span class="badge" id="mode">🤖 Robot ready</span><button id="demo">✨ Watch me move</button></div><div class="actions"><button id="chatBtn">💬 Chat</button><button id="learnBtn">📚 Learn</button><button id="playBtn">🎲 Play</button></div><div class="chat" id="chat" role="log"><div class="msg bot">Hello, Yuaan! 🤖</div></div><div class="controls"><button class="mic" id="mic">🎤 Talk</button><input id="message" maxlength="350" placeholder="Say something..." aria-label="Message"><button class="send" id="send">Send</button></div><div class="settings"><input type="checkbox" id="voice" checked><label for="voice">Speak replies aloud</label><button id="stop" style="margin-left:auto;padding:8px">🔇 Stop</button></div><div class="status" id="status">Ready to play!</div><div class="foot">Parent-supervised. Microphone and Malayalam speech depend on browser and installed voices. The animated robot works without AI; conversations require a valid Gemini API connection.</div></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id),robot=$('robot');let lang='en',busy=false,recognition=null,resetTimer=null;const history=[];function pose(s){robot.classList.remove('happy','talking','listening','thinking','excited');robot.classList.add(s)}function bubble(s){$('bubble').textContent=s}function status(s){$('status').textContent=s}function add(t,who){const e=document.createElement('div');e.className='msg '+who;e.textContent=t;$('chat').append(e);$('chat').scrollTop=$('chat').scrollHeight}function speak(t){if(!$('voice').checked||!window.speechSynthesis){pose('happy');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang=lang==='ml'?'ml-IN':'en-US';u.rate=.85;u.pitch=1.2;const v=speechSynthesis.getVoices().find(v=>v.lang.toLowerCase().startsWith(lang==='ml'?'ml':'en'));if(v)u.voice=v;u.onstart=()=>{pose('talking');$('mode').textContent='🔊 Speaking'};u.onend=u.onerror=()=>{pose('happy');$('mode').textContent='🤖 Robot ready'};speechSynthesis.speak(u)}async function send(t){t=String(t||'').trim();if(!t||busy)return;busy=true;$('send').disabled=$('mic').disabled=true;add(t,'me');$('message').value='';pose('thinking');$('mode').textContent='💭 Thinking';status(lang==='ml'?'ആലോചിക്കുന്നു...':'Thinking...');try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:t,language:lang,history:history.slice(-6)})});const d=await r.json();if(!r.ok)throw Error(d.error||'AI unavailable');const reply=String(d.reply||'').trim();if(!reply)throw Error('Empty AI reply');add(reply,'bot');bubble(reply);history.push({role:'user',text:t},{role:'model',text:reply});if(history.length>12)history.splice(0,history.length-12);speak(reply);status('Ready!')}catch(e){const msg=e.message||'Connection failed';add(msg,'bot');bubble('Oops! Ask a parent to check my connection.');pose('happy');$('mode').textContent='⚠️ AI offline';status(msg)}finally{busy=false;$('send').disabled=$('mic').disabled=false}}function setLang(l){lang=l;$('en').classList.toggle('active',l==='en');$('ml').classList.toggle('active',l==='ml');speechSynthesis?.cancel();pose('happy');bubble(l==='ml'?'ഹായ് യുവാൻ! നമുക്ക് കളിക്കാം!':'Hi Yuaan! Let’s play!')}function mic(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){status('Speech recognition unavailable; type instead.');return}if(recognition){recognition.abort();return}const r=new SR();recognition=r;r.lang=lang==='ml'?'ml-IN':'en-IN';r.onstart=()=>{pose('listening');$('mode').textContent='🎤 Listening';status('Listening...');$('mic').textContent='🛑 Stop'};r.onresult=e=>send(e.results[0][0].transcript);r.onerror=e=>status('Microphone: '+e.error);r.onend=()=>{recognition=null;$('mic').textContent='🎤 Talk';if(!busy){pose('happy');$('mode').textContent='🤖 Robot ready'}};try{speechSynthesis?.cancel();r.start()}catch(e){status('Microphone unavailable')}}$('en').onclick=()=>setLang('en');$('ml').onclick=()=>setLang('ml');$('send').onclick=()=>send($('message').value);$('message').onkeydown=e=>{if(e.key==='Enter')send($('message').value)};$('mic').onclick=mic;$('chatBtn').onclick=()=>send(lang==='ml'?'ഹായ്! നമുക്ക് സംസാരിക്കാം':'Hi! Let’s chat!');$('learnBtn').onclick=()=>send(lang==='ml'?'ഒരു നിറം പഠിപ്പിക്കൂ':'Teach me a color!');$('playBtn').onclick=()=>send(lang==='ml'?'നമുക്ക് ഒരു കളി കളിക്കാം':'Let’s play an animal guessing game!');$('stop').onclick=()=>{speechSynthesis?.cancel();recognition?.abort();pose('happy');$('mode').textContent='🤖 Robot ready'};$('demo').onclick=()=>{speechSynthesis?.cancel();pose('excited');$('mode').textContent='✨ Happy dance';bubble(lang==='ml'?'ഹായ് യുവാൻ! ഞാൻ നൃത്തം ചെയ്യുന്നു! 🎉':'Hello Yuaan! Look, I can dance! 🎉');status('Animation is working!');clearTimeout(resetTimer);resetTimer=setTimeout(()=>{pose('happy');$('mode').textContent='🤖 Robot ready'},3000);};})();
</script></body></html>
